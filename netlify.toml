# Netlify configuration for asheraw.com
# Deployment docs: https://docs.netlify.com/frameworks/next-js/overview/

[build]
  # Build command — same as Next.js standard
  command = "npm run build"
  # Where built site lives for deployment
  publish = ".next"
  # Node version
  node_version = "22.12"

# Environment variables are set in Netlify UI (Settings > Build & deploy > Environment)
# -- SANITY_DATASET, SANITY_PROJECT_ID, SANITY_API_READ_TOKEN, NEXT_PUBLIC_SANITY_DATASET, etc.
# (originally copied over from Vercel's own env var settings during the migration off it)

# Scheduled tasks (purge-trash, check-links, publish-scheduled -- see
# vercel.json's `crons` for the original Vercel version of this) do NOT
# run from this file. A first attempt using this file's own [[functions]]
# blocks was invalid Netlify config (confirmed directly via `netlify
# status`: "Configuration property functions must be an object" --
# functions is a singular table, not an array, and Netlify Scheduled
# Functions only schedule real Netlify Functions by name, not an arbitrary
# path like a Vercel cron entry does) and broke every deploy since it was
# added -- removed rather than guessed at again.
#
# The actual working replacement: three GitHub Actions workflows
# (.github/workflows/cron-*.yml), each on the same schedule the original
# vercel.json entry used, calling the route over HTTPS with the same
# CRON_SECRET auth the routes already checked. Confirmed running
# successfully on schedule as of 2026-08-30. Netlify itself still plays no
# part in triggering these -- it only hosts the routes being called.

# Security headers and CSP are defined in next.config.ts via the headers() function
# No need to duplicate them here — Next.js will apply them at build time
# (Netlify respects Next.js's built-in header configuration)

# Redirects (if any) — add as needed via Sanity Studio's Redirect type
# or manually here:
# Example:
# [[redirects]]
#   from = "/old-path/*"
#   to = "/new-path/:splat"
#   status = 301
