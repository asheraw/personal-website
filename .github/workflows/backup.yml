name: Daily Content Backup

# Backs up the Sanity content (all blog posts, authors, categories, images)
# to a downloadable file, once a day, automatically. This runs on GitHub's
# servers, not on Asher's computer, so it happens even if the laptop is off.
#
# To avoid piling up identical copies, a saved backup only happens on days
# when the content actually changed. A tiny fingerprint file
# (.backup-state/last-hash.txt) is how it remembers what "yesterday" looked
# like -- it's just a short line of text, not a copy of your content.
#
# This only installs the one small tool needed to talk to Sanity -- it does
# NOT install or build the whole website, so it can't be broken by unrelated
# website dependency changes.
#
# Requires a repository secret named SANITY_API_TOKEN.
# See BACKUP_AND_RECOVERY_GUIDE.md for setup steps and how to restore.

on:
  schedule:
    - cron: '0 9 * * *' # every day at 09:00 UTC
  workflow_dispatch: {} # lets a human trigger it manually from the Actions tab

permissions:
  contents: write # needed so the workflow can update the fingerprint file

env:
  # Public project identifiers (not secret) -- same values as .env.local,
  # repeated here because CI doesn't have access to that (gitignored) file.
  NEXT_PUBLIC_SANITY_PROJECT_ID: oj9eajjd
  NEXT_PUBLIC_SANITY_DATASET: production

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Sanity CLI only
        run: npm install --no-save sanity@^5.31.1

      - name: Export Sanity content
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: |
          if [ -z "$SANITY_API_TOKEN" ]; then
            echo "::error::SANITY_API_TOKEN secret is not set. See BACKUP_AND_RECOVERY_GUIDE.md."
            exit 1
          fi
          npx sanity dataset export production sanity-backup.tar.gz --token "$SANITY_API_TOKEN"

      - name: Check whether content actually changed since the last backup
        id: check
        run: |
          # Hash only the actual document content, not the .tar.gz container
          # (the container's timestamps differ every run even with no real changes).
          NEW_HASH=$(tar -xzf sanity-backup.tar.gz -O data.ndjson | sha256sum | cut -d' ' -f1)
          OLD_HASH=""
          if [ -f .backup-state/last-hash.txt ]; then
            OLD_HASH=$(cat .backup-state/last-hash.txt)
          fi
          echo "new_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"
          if [ "$NEW_HASH" = "$OLD_HASH" ]; then
            echo "No content changes since the last backup -- skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Content changed since the last backup -- saving a new one."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename backup with today's date
        if: steps.check.outputs.changed == 'true'
        run: mv sanity-backup.tar.gz "sanity-backup-$(date +%Y-%m-%d).tar.gz"

      - name: Upload backup as an artifact
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sanity-backup-${{ github.run_id }}
          path: sanity-backup-*.tar.gz
          retention-days: 30

      - name: Record today's fingerprint
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p .backup-state
          echo "${{ steps.check.outputs.new_hash }}" > .backup-state/last-hash.txt
          git config user.name "asheraw-backup-bot"
          git config user.email "actions@github.com"
          git add .backup-state/last-hash.txt
          git commit -m "Update content backup fingerprint [skip ci]"
          git push
