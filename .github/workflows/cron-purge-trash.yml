name: Cron - Purge Trash

# Calls /api/cron/purge-trash once a day, on GitHub's own servers -- the
# scheduler that used to do this was Vercel's built-in Cron feature
# (see vercel.json's crons entry), which stopped applying the moment
# asheraw.com's DNS moved to Netlify. This is that replacement: same
# schedule, same endpoint, same secret, just triggered from here instead.
#
# Permanently deletes any comment or photo that's been sitting in Studio's
# Trash view for 30+ days. The route itself is unchanged and still checks
# the same CRON_SECRET before doing anything -- this workflow only needs
# to know that one value to be allowed to call it.
#
# Requires a repository secret named CRON_SECRET, matching the exact
# value set as an environment variable on the live site (Netlify).

on:
  schedule:
    - cron: '0 3 * * *' # every day at 03:00 UTC
  workflow_dispatch: {} # lets a human trigger it manually from the Actions tab

jobs:
  call-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call the purge-trash endpoint
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET repository secret is not set."
            exit 1
          fi
          status=$(curl -s -o /dev/stderr -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://asheraw.com/api/cron/purge-trash)
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::purge-trash returned $status"
            exit 1
          fi
