<!doctype html><html><head><meta charset="utf-8"><title>Reel 5 panel</title>
<style>
  :root { --ink:#121417; --ink2:#1b1e23; --ink3:#22262c; --acc:#f0b865; --accd:#d99846; --accl:#f8d08a; --paper:#f4f1e8; --olive:#6e5a1e; --alarm:#fe6b3d; --dim:#8a8f98; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); color: #fff; }
  body { font-family: "Bahnschrift", "Arial Narrow", sans-serif; font-variation-settings: "wdth" 70; }
  .mono { font-family: "Consolas", monospace; font-variation-settings: normal; letter-spacing: .08em; }
  #stage { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 70% at 30% 20%, #23272e 0%, #121417 70%); overflow: hidden; }
  .fin { position: absolute; top: -200px; height: 1500px; width: 160px; background: linear-gradient(90deg, transparent, rgba(240,184,101,.07), transparent); transform: rotate(24deg); }
  .sc { position: absolute; left: 96px; top: 56px; width: 1728px; height: 784px; opacity: 0; }
  .abs { position: absolute; }
  .plate { position: absolute; width: 520px; height: 180px; transform: skewX(-12deg); background: linear-gradient(135deg, var(--accl), var(--acc) 45%, var(--accd)); box-shadow: 0 12px 40px rgba(0,0,0,.5); overflow: hidden; }
  .plate .bar1 { position: absolute; left: 0; top: 0; bottom: 0; width: 26px; background: var(--ink); }
  .plate .bar2 { position: absolute; left: 34px; top: 0; bottom: 0; width: 10px; background: #fff3d8; }
  .plate .nm { position: absolute; left: 70px; top: 10px; font-size: 70px; font-weight: 800; color: var(--ink); letter-spacing: 0; top: 24px; transform: skewX(12deg); white-space: nowrap; line-height: 1.05; }
  .plate .sub { position: absolute; left: 76px; bottom: 12px; font-size: 30px; font-weight: 700; color: #3a2d12; letter-spacing: .2em; transform: skewX(12deg); }
  #tab { position: absolute; left: 96px; top: 856px; height: 48px; padding: 0 28px; background: var(--acc); color: var(--ink); font-size: 34px; font-weight: 800; letter-spacing: .12em; display: flex; align-items: center; opacity: 0; }
  #strap { position: absolute; left: 96px; top: 904px; width: 1250px; height: 104px; background: var(--paper); color: var(--ink); overflow: hidden; opacity: 0; }
  #strap .h { position: absolute; left: 36px; top: 6px; font-size: 62px; font-weight: 800; white-space: nowrap; letter-spacing: .005em; }
  #strap .s { position: absolute; left: 38px; top: 72px; font-size: 27px; font-weight: 600; color: var(--olive); white-space: nowrap; letter-spacing: .08em; }
  #strapend { position: absolute; left: 1346px; top: 904px; width: 120px; height: 104px; background: var(--ink2); border-bottom: 6px solid var(--acc); opacity: 0; }
  #src { position: absolute; right: 84px; top: 950px; font-size: 20px; color: rgba(255,255,255,.75); text-align: right; opacity: 0; }
  #tag { position: absolute; left: 96px; top: 56px; width: 330px; height: 64px; background: var(--ink3); border: 2px solid var(--acc); color: var(--acc); font-size: 26px; display: flex; align-items: center; justify-content: center; opacity: 0; z-index: 8; }
  #wipe { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 30; pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 40; pointer-events: none; }
  .card { position: absolute; background: var(--ink2); border-top: 6px solid var(--acc); padding: 30px 40px; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
  .lbl { font-size: 36px; letter-spacing: .08em; color: var(--dim); font-weight: 700; }
  .stamp { position: absolute; padding: 6px 36px; border: 8px double var(--acc); color: var(--acc); font-size: 120px; font-weight: 800; letter-spacing: .06em; transform-origin: center; opacity: 0; background: rgba(18,20,23,.7); white-space: nowrap; }
  .tile { position: relative; display: inline-block; width: 130px; height: 190px; margin-right: 10px; background: var(--ink3); border: 2px solid #30353d; border-radius: 12px; font-size: 150px; font-weight: 800; text-align: center; line-height: 190px; color: var(--acc); overflow: hidden; }
  .tile::after { content: ""; position: absolute; left: 0; right: 0; top: 94px; height: 4px; background: #0a0b0d; }
  .row { position: absolute; left: 0; width: 1500px; height: 150px; background: var(--ink2); border-left: 0; display: flex; align-items: center; opacity: 0; }
  .row .n { width: 150px; height: 150px; background: linear-gradient(135deg, var(--accl), var(--accd)); color: var(--ink); font-size: 120px; font-weight: 800; text-align: center; line-height: 150px; flex: none; }
  .row .t { margin-left: 48px; font-size: 72px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
  .row .tick { margin-left: auto; margin-right: 50px; width: 90px; height: 90px; border-radius: 50%; background: #2c8a4a; font-size: 70px; text-align: center; line-height: 90px; opacity: 0; font-variation-settings: normal; }
  .paper { background: var(--paper); color: var(--ink); }
  .bar { position: absolute; height: 78px; background: var(--acc); left: 0; transform-origin: 0 50%; }
  .barl { position: absolute; font-size: 50px; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
  .barv { position: absolute; font-size: 66px; font-weight: 800; color: var(--ink); }
</style></head>
<body><div id="stage"></div><canvas id="wipe" width="1920" height="1080"></canvas><div id="flash"></div>
<script type="module" src="main.js"></script></body></html>
