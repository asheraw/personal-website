<!doctype html>
<html lang="en"><head><meta charset="UTF-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  @font-face { font-family: "Patrick Hand"; src: url("assets/fonts/PatrickHand-normal-400.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/fonts/Montserrat-800.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 500; src: url("assets/fonts/GeistMono-normal-500.woff2") format("woff2"); }
  @font-face { font-family: "Playfair Display"; font-weight: 400 900; src: url("assets/fonts/PlayfairDisplay-normal-400_900.woff2") format("woff2"); }
  body { margin: 0; background: #0a0807; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0a0807; }
  .glow { position: absolute; left: -15%; top: 0; width: 130%; height: 1000px; background: radial-gradient(ellipse 55% 70% at 50% -5%, rgba(240,184,101,.34), rgba(240,184,101,.08) 55%, transparent 76%); }
  .series { position: absolute; left: 130px; top: 340px; display: flex; align-items: center; gap: 16px; font: 500 30px "Geist Mono", monospace; letter-spacing: .26em; color: #f0b865; }
  .series i { display: block; width: 46px; height: 2px; background: #f0b865; opacity: .5; }
  .logo { position: absolute; right: 130px; top: 320px; width: 64px; height: 64px; }
  /* whiteboard */
  .board { position: absolute; left: 60px; top: 440px; width: 960px; height: 552px; box-sizing: border-box; border: 7px solid #b8924a; border-radius: 18px; overflow: hidden; background: linear-gradient(160deg, #fdfcf8, #f2f0ea); box-shadow: 0 22px 50px rgba(0,0,0,.55); }
  .sheen { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 32%, rgba(255,255,255,.55) 44%, transparent 54%); }
  .h { position: absolute; font-family: "Patrick Hand", cursive; color: #1b1714; white-space: nowrap; }
  .gold { color: #a8742a; } .red { color: #c44d3f; }
  svg.ink { position: absolute; inset: 0; overflow: visible; }
  /* Asher */
  #pwin { position: absolute; left: 0; top: 1040px; width: 1080px; height: 740px; overflow: hidden; }
  #pwin img { position: absolute; left: -170px; top: -14px; width: 1420px; height: 799px; }
  .seam { position: absolute; left: 0; top: 1036px; width: 1080px; height: 4px; background: #b8924a; opacity: .7; z-index: 3; }
  #pwin::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 140px; background: linear-gradient(transparent, #0a0807 92%); }
  .tag { position: absolute; left: 540px; top: 1625px; transform: translateX(-50%); z-index: 5; font: 800 62px "Montserrat", sans-serif; color: #f5efe4; -webkit-text-stroke: .13em #0a0807; paint-order: stroke fill; white-space: nowrap; }
  .tag b { color: #f0b865; }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="1">
  <div class="glow"></div>
  <div class="series"><i></i>OFFER REGRETS</div>
  <img class="logo" src="assets/asher-mark-gold.svg" alt="" />
  <div class="board"><img src="assets/board.jpg" style="position:absolute;left:0;top:0;width:100%;height:100%" /></div>
  <div class="seam"></div>
  <div id="pwin"><img src="assets/asher.png" alt="" /></div>
  <div class="tag">defend it, <b>don't</b> just draft it</div>
</div>
<script>window.__timelines["main"] = gsap.timeline({ paused: true });</script>
</body></html>
